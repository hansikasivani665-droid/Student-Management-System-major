href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<div class="layout">



<!-- SIDEBAR -->

<aside class="sidebar">


<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

<h2>SMS</h2>

</div>





<nav>


<a href="/html/dashboard.html">

<i class="fa-solid fa-chart-line"></i>

Dashboard

</a>



<a href="/html/student-list.html">

<i class="fa-solid fa-users"></i>

Students

</a>



<a href="/html/add-student.html">

<i class="fa-solid fa-user-plus"></i>

Add Student

</a>



<a href="/html/attendance.html">

<i class="fa-solid fa-calendar-check"></i>

Attendance

</a>




<a class="active" href="/html/results.html">

<i class="fa-solid fa-chart-column"></i>

Results

</a>



<a href="/html/admin-profile.html">

<i class="fa-solid fa-user"></i>

Profile

</a>



<a href="/html/settings.html">

<i class="fa-solid fa-gear"></i>

Settings

</a>


</nav>


</aside>








<!-- MAIN CONTENT -->


<main class="main-content">





<header class="top-header">


<div>

<h1>

<i class="fa-solid fa-chart-column"></i>

Results Management

</h1>


<p>

Manage student academic results

</p>


</div>



<div>

<button onclick="location.href='dashboard.html'">

<i class="fa-solid fa-house"></i>

Dashboard

</button>

</div>


</header>









<!-- RESULT CARDS -->


<section class="cards">


<div class="card">

<i class="fa-solid fa-file-lines"></i>

<div>

<h3>
Total Results
</h3>


<h2 id="totalResults">
0
</h2>


</div>

</div>





<div class="card">

<i class="fa-solid fa-chart-line"></i>


<div>

<h3>
Average Marks
</h3>


<h2 id="averageMarks">
0%
</h2>


</div>


</div>







<div class="card">


<i class="fa-solid fa-award"></i>


<div>

<h3>
Pass Percentage
</h3>


<h2 id="passPercentage">
0%
</h2>


</div>


</div>





</section>









<!-- SEARCH -->


<section class="toolbar">


<input

type="text"

id="searchResult"

placeholder="Search student name or roll number"

onkeyup="searchResults()"


>



<button disabled>

<i class="fa-solid fa-eye"></i>

View Results

</button>


</section>









<!-- TABLE -->


<section class="table-card">


<table>


<thead>


<tr>

<th>
#
</th>


<th>
Roll No
</th>


<th>
Name
</th>


<th>
Department
</th>

<th>
Year    
</th>

<th>
Subject
</th>


<th>
Marks
</th>


<th>
Grade
</th>


<th>
Status
</th>


</tr>


</thead>




<tbody id="resultTableBody">


</tbody>



</table>



</section>








<footer>


<p>

© 2026 Student Management System | Results Module

</p>


</footer>





</main>



</div>







<script src="../js/results.js"></script>

</html>
