<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Profile | SMS</title>

<link rel="stylesheet" href="/css/profile.css">

<link rel="icon" href="images/favicon.png">

</head>


<body>


<div class="profile-container">


<header>

<h1>👨‍🏫 Teacher Profile</h1>

<p>Student Management System</p>

</header>




<section class="profile-card">


<img src="images/favicon.png"
alt="Teacher Image">



<div class="details">


<h2 id="teacherName">
Teacher Name
</h2>


<p>
📧 Email :
<span id="teacherEmail">
teacher@gmail.com
</span>
</p>


<p>
🏢 Department :
<span id="department">
Computer Science
</span>
</p>


<p>
📚 Subject :
<span id="subject">
Database Management System
</span>
</p>


<p>
📞 Phone :
<span id="phone">
9876543210
</span>
</p>



<p>
🆔 Employee ID :
<span id="employeeId">
T001
</span>
</p>


</div>


</section>




<button onclick="history.back()">
⬅ Back
</button>



</div>


<script>


document.getElementById("teacherName")
.innerHTML =
localStorage.getItem("teacherName") || "Teacher";

</script>


</body>

</html>
