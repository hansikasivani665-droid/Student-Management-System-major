<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student | Student Management System</title>


    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="../css/dashboard.css">

    <!-- Add Student CSS -->
    <link rel="stylesheet" href="../css/add-student.css">


    <!-- Font Awesome Icons -->
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<div class="dashboard-container">


    <!-- Sidebar -->

    <aside class="sidebar">


        <div class="logo">

            <i class="fa-solid fa-graduation-cap"></i>

            <h2>SMS</h2>

        </div>



        <ul>


            <li>
                <a href="/html/dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>



            <li>
                <a href="/html/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>



            <li class="active">

                <a href="/html/add-student.html">

                    <i class="fa-solid fa-user-plus"></i>

                    Add Student

                </a>

            </li>



            <li>

                <a href="/html/student-list.html">

                    <i class="fa-solid fa-users"></i>

                    Student List

                </a>

            </li>



            <li>

                <a href="/html/attendance.html">

                    <i class="fa-solid fa-calendar-check"></i>

                    Attendance

                </a>

            </li>



            <li>

                <a href="/html/results.html">

                    <i class="fa-solid fa-chart-line"></i>

                    Results

                </a>

            </li>



            <li>

                <a href="/html/index.html">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>



        </ul>


    </aside>






    <!-- Main Content -->


    <main class="main-content">


        <div class="page-header">


            <div>

                <h1>
                    Add New Student
                </h1>

                <p>
                    Register a new student into the system
                </p>


            </div>



            <div class="header-icon">

                <i class="fa-solid fa-user-plus"></i>

            </div>



        </div>







        <!-- Form Card -->


        <section class="student-form-card">


            <form id="studentForm">



                <div class="form-grid">



                    <div class="form-group">

                        <label>
                            Roll Number *
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-id-card"></i>

                            <input 
                            type="text"
                            id="rollNo"
                            placeholder="Enter roll number"
                            required>

                        </div>

                    </div>





                    <div class="form-group">

                        <label>
                            Full Name *
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>


                            <input 
                            type="text"
                            id="name"
                            placeholder="Enter student name"
                            required>


                        </div>


                    </div>






                    <div class="form-group">

                        <label>
                            Email *
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>


                            <input 
                            type="email"
                            id="email"
                            placeholder="student@gmail.com"
                            required>


                        </div>


                    </div>






                    <div class="form-group">

                        <label>
                            Phone Number *
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-phone"></i>


                           <input 
    type="tel"
    id="phone"
    name="phone"
    maxlength="10"
    pattern="[0-9]{10}"
    placeholder="Enter 10 digit phone number"
    required>


                        </div>


                    </div>







                    <div class="form-group">

                        <label>
                            Date of Birth
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-calendar"></i>


                            <input 
                            type="date"
                            id="dob">


                        </div>


                    </div>








                    <div class="form-group">


                        <label>
                            Gender
                        </label>


                        <div class="input-box">


                            <i class="fa-solid fa-venus-mars"></i>


                            <select id="gender">


                                <option>Select Gender</option>

                                <option>Male</option>

                                <option>Female</option>

                                <option>Other</option>


                            </select>


                        </div>


                    </div>








                    <div class="form-group">


                        <label>
                            Department
                        </label>


                        <div class="input-box">


                            <i class="fa-solid fa-building-columns"></i>


                            <select id="department">


                                <option>CSE</option>

                                <option>ECE</option>

                                <option>EEE</option>

                                <option>Mechanical</option>

                                <option>Civil</option>


                            </select>


                        </div>


                    </div>








                    <div class="form-group">


                        <label>
                            Academic Year
                        </label>


                        <div class="input-box">


                            <i class="fa-solid fa-graduation-cap"></i>


                            <select id="year">


                                <option>1st Year</option>

                                <option>2nd Year</option>

                                <option>3rd Year</option>

                                <option>4th Year</option>


                            </select>


                        </div>


                    </div>




                </div>







                <div class="form-group full-width">


                    <label>
                        Address
                    </label>


                    <textarea 
                    id="address"
                    placeholder="Enter complete address">
                    </textarea>


                </div>







                <button class="submit-btn" type="submit">


                    <i class="fa-solid fa-user-plus"></i>

                    Add Student


                </button>





                <p id="message"></p>



            </form>



        </section>




    </main>



</div>





<script src="../js/add-student.js"></script>


</body>


</html>
