```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Results</title>

<link rel="stylesheet" href="../css/teacher-results.css">

</head>


<body>


<div class="container">


<h1>Enter Student Results</h1>


<div class="form-section">


<label>Teacher ID</label>

<input 
type="text"
id="teacherId"
placeholder="Enter Teacher ID">



<label>Subject</label>

<input 
type="text"
id="subject"
placeholder="Enter Subject">



<label>Department</label>

<select id="department">

<option value="">
Select Department
</option>

<option value="CSE">CSE</option>

<option value="ECE">ECE</option>

<option value="EEE">EEE</option>

<option value="AIML">AIML</option>

<option value="Data Science">
Data Science
</option>

</select>




<label>Year</label>

<select id="year">

<option value="">
Select Year
</option>

<option value="I">I</option>

<option value="II">II</option>

<option value="III">III</option>

<option value="IV">IV</option>

</select>



<button id="loadStudents">

Load Students

</button>


</div>





<table>


<thead>

<tr>

<th>
Roll No
</th>


<th>
Name
</th>


<th>
Marks
</th>


</tr>

</thead>



<tbody id="studentTable">

<tr>

<td colspan="3">

Select details and load students

</td>

</tr>


</tbody>


</table>





<button id="saveResults">

Save Results

</button>



<p id="message"></p>


</div>



<script src="../js/teacher-results.js"></script>


</body>

</html>
```
