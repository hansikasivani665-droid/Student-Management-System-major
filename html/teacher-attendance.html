<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Attendance</title>

<link rel="stylesheet" href="../css/teacher-attendance.css">

</head>


<body>


<div class="container">


<h1>Mark Student Attendance</h1>



<div class="form-section">


<div>

<label>Teacher ID</label>

<input id="teacherId" readonly>

</div>



<div>

<label>Subject</label>

<input id="subject" readonly>

</div>




<div>

<label>Department</label>

<select id="department">

<option value="">
Select Department
</option>

<option value="CSE">
CSE
</option>

<option value="ECE">
ECE
</option>

<option value="EEE">
EEE
</option>

<option value="AIML">
AIML
</option>

<option value="Data Science">
Data Science
</option>

</select>

</div>




<div>

<label>Year</label>

<select id="year">

<option value="">
Select Year
</option>

<option value="I">
I
</option>

<option value="II">
II
</option>

<option value="III">
III
</option>

<option value="IV">
IV
</option>


</select>


</div>




<div>

<label>Date</label>

<input 
type="date"
id="attendanceDate">


</div>


</div>





<button id="loadStudents">

Load Students

</button>





<table>


<thead>

<tr>

<th>
Roll No
</th>


<th>
Name
</th>


<th>
Department
</th>


<th>
Year
</th>


<th>
Status
</th>


</tr>

</thead>



<tbody id="studentTable">


<tr>

<td colspan="5">

Select Department & Year

</td>


</tr>


</tbody>


</table>





<button id="saveAttendance">

Save Attendance

</button>




<p id="message"></p>



</div>





<script src="../js/teacher-attendance.js"></script>


</body>

</html>
