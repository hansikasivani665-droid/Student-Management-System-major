<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Teacher Dashboard</title>

    <link rel="stylesheet"
        href="../css/teacher-dashboard.css">

    <link rel="icon"
        href="../assets/images/favicon.png">

</head>

<body>

<header>

    <h1>👨‍🏫 Teacher Dashboard</h1>

    <h2 id="teacherName">
        Welcome Teacher
    </h2>

    <p id="currentDate"></p>

    <p id="currentTime"></p>

</header>

<section class="cards">

    <div class="card">

        <h3>Total Students</h3>

        <h1 id="totalStudents">0</h1>

    </div>

    <div class="card">

        <h3>Present Today</h3>

        <h1 id="presentStudents">0</h1>

    </div>

    <div class="card">

        <h3>Absent Today</h3>

        <h1 id="absentStudents">0</h1>

    </div>

    <div class="card">

        <h3>Results Entered</h3>

        <h1 id="resultsCount">0</h1>

    </div>

</section>

<nav>

    <a href="teacher-attendance.html">
        📅 Attendance
    </a>

    <a href="teacher-results.html">
        📊 Results
    </a>

    <a href="teacher-student-list.html">
        📚 Student List
    </a>

    <a href="logout.html"
        id="logout">
        🚪 Logout
    </a>

</nav>

<footer>

    © 2026 Student Management System

</footer>

<script src="../js/teacher-dashboard.js"></script>

</body>

</html>
